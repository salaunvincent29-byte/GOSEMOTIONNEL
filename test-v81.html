<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b6178"><meta name="description" content="GPS émotionnel V8.1 : questionnaire, boussole et communication visuelle.">
<meta name="apple-mobile-web-app-capable" content="yes"><title>GPS émotionnel V8.1</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
</head><body>
<header class="top"><div><p>COMPAGNON ÉMOTIONNEL</p><h1>GPS émotionnel V8.1</h1></div><button id="settingsBtn" class="icon-btn">Aa</button></header>
<main id="app" aria-live="polite"></main>
<nav class="nav">
<button data-view="home" class="active">Accueil</button><button data-view="gps">GPS</button><button data-view="visual">Photos</button><button data-view="compass">Boussole</button><button data-view="communicate">Communiquer</button><button data-view="history">Historique</button>
</nav>
<dialog id="settingsDialog"><form method="dialog"><div class="dialog-head"><h2>Réglages</h2><button class="icon-btn" value="cancel">×</button></div>
<label class="field">Taille du texte<select id="fontSize"><option value="normal">Normale</option><option value="large">Grande</option><option value="xlarge">Très grande</option></select></label>
<label class="check"><input id="contrast" type="checkbox"> Contraste renforcé</label>
<label class="check"><input id="motion" type="checkbox"> Réduire les animations</label>
<label class="check"><input id="snapCompass" type="checkbox" checked> Accrocher l’aiguille à l’émotion la plus proche</label>
<label class="check"><input id="confirmSpeech" type="checkbox" checked> Confirmer avant de faire parler le téléphone</label>
<button id="saveSettings" class="primary">Enregistrer</button></form></dialog>
<script src="app.js"></script><script>
window.addEventListener('load',()=>{
 try{
  S.view='visual'; S.visualScreen='final'; S.visualShortlist=VISUAL_CORPUS.slice(0,5); S.visualFinal=[1,2,3]; render();
  const btn=document.getElementById('visualAnalyse');
  const report=document.createElement('pre'); report.id='test-report';
  report.textContent=JSON.stringify({disabled:btn.disabled,onclickType:typeof btn.onclick,onclickIsFunction:btn.onclick===window.visualAnalyse,globalType:typeof window.visualAnalyse});
  document.body.appendChild(report);
  btn.click();
  setTimeout(()=>{report.textContent += '\nAFTER:'+JSON.stringify({screen:S.visualScreen,hasResult:!!S.visualResult,error:window.__err||null});},50);
 }catch(e){const r=document.createElement('pre');r.id='test-report';r.textContent='ERR:'+e.stack;document.body.appendChild(r)}
});
window.addEventListener('error',e=>window.__err=String(e.error||e.message));
</script></body></html>
